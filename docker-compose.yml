services:
  trace-api:
    build: .
    image: drug-trace-api:latest
    container_name: drug-trace-api
    ports:
      - "8000:8000"
    environment:
      TRACE_DB_PATH: /data/trace.db
    volumes:
      - trace-data:/data
    # 进程地址空间上限 256 MiB：纯追加路径的内存占用与历史扫描规模无关
    mem_limit: 256m
    memswap_limit: 256m
    restart: unless-stopped

volumes:
  trace-data:
